<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Curso Rota</title>
<style>
:root {
  --dark: #07170d;
  --green: #12391f;
  --gold: #d8a735;
  --light: #fff7de;
  --ok: #8df0a4;
  --bad: #ff9b9b;
  --text: #172017;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top left, rgba(216, 167, 53, 0.38), transparent 34%), 
              linear-gradient(135deg, #06170c 0%, #0d2817 50%, #06170c 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 1080px;
  background: rgba(255, 255, 255, 0.985);
  border: 5px solid var(--dark);
  border-radius: 30px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
  padding: 30px;
  z-index: 1;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOYAAATmCAYAAACF/K4qAAAQAElEQVR4Aby9AZosOY6kB/QJND07c4Jd6f4XXOr/DaQHIzLyVXVrP/HRCMBgAOl0");
  opacity: 0.05;
  z-index: -1;
}

h1 {
  color: var(--dark);
  text-align: center;
  margin-bottom: 30px;
  font-size: 28px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  color: var(--dark);
  font-weight: bold;
  margin-bottom: 8px;
}

input[type="text"],
input[type="email"],
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--green);
  border-radius: 8px;
  font-family: Arial, sans-serif;
  font-size: 16px;
  color: var(--text);
}

input[type="text"]:focus,
input[type="email"]:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 8px rgba(216, 167, 53, 0.3);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

.quiz-section {
  margin: 30px 0;
  padding: 20px;
  background: rgba(18, 57, 31, 0.05);
  border-left: 4px solid var(--green);
  border-radius: 8px;
}

.quiz-question {
  margin-bottom: 20px;
}

.quiz-question p {
  color: var(--dark);
  font-weight: bold;
  margin-bottom: 10px;
}

.option {
  margin-bottom: 10px;
}

.option input[type="radio"] {
  margin-right: 10px;
}

.option label {
  display: inline;
  margin: 0;
  font-weight: normal;
}

button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--green) 0%, var(--dark) 100%);
  color: var(--light);
  border: none;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(7, 23, 13, 0.3);
}

button:active {
  transform: translateY(0);
}

.success-message {
  display: none;
  background: var(--ok);
  color: var(--dark);
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
  text-align: center;
  border: 2px solid var(--green);
}

.error-message {
  display: none;
  background: var(--bad);
  color: var(--dark);
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
  text-align: center;
  border: 2px solid #ff6b6b;
}
</style>
</head>
<body>

<div class="card">
  <h1>📚 Quiz Curso Rota</h1>
  
  <form id="quizForm" action="https://formspree.io/f/xgodpbgr" method="POST">
    
    <!-- Dados Pessoais -->
    <div class="form-group">
      <label for="nome">👤 Seu Nome:</label>
      <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
    </div>

    <div class="form-group">
      <label for="email">📧 Seu Email:</label>
      <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
    </div>

    <!-- Questões do Quiz -->
    <div class="quiz-section">
      <div class="quiz-question">
        <p>1️⃣ Qual é a capital do Brasil?</p>
        <div class="option">
          <input type="radio" id="q1_a" name="questao1" value="Brasília" required>
          <label for="q1_a">Brasília</label>
        </div>
        <div class="option">
          <input type="radio" id="q1_b" name="questao1" value="São Paulo">
          <label for="q1_b">São Paulo</label>
        </div>
        <div class="option">
          <input type="radio" id="q1_c" name="questao1" value="Rio de Janeiro">
          <label for="q1_c">Rio de Janeiro</label>
        </div>
      </div>

      <div class="quiz-question">
        <p>2️⃣ Qual linguagem de programação é mais usada para web?</p>
        <div class="option">
          <input type="radio" id="q2_a" name="questao2" value="JavaScript" required>
          <label for="q2_a">JavaScript</label>
        </div>
        <div class="option">
          <input type="radio" id="q2_b" name="questao2" value="Python">
          <label for="q2_b">Python</label>
        </div>
        <div class="option">
          <input type="radio" id="q2_c" name="questao2" value="Java">
          <label for="q2_c">Java</label>
        </div>
      </div>

      <div class="quiz-question">
        <p>3️⃣ Qual é o planeta mais próximo do Sol?</p>
        <div class="option">
          <input type="radio" id="q3_a" name="questao3" value="Mercúrio" required>
          <label for="q3_a">Mercúrio</label>
        </div>
        <div class="option">
          <input type="radio" id="q3_b" name="questao3" value="Vênus">
          <label for="q3_b">Vênus</label>
        </div>
        <div class="option">
          <input type="radio" id="q3_c" name="questao3" value="Terra">
          <label for="q3_c">Terra</label>
        </div>
      </div>
    </div>

    <!-- Observações -->
    <div class="form-group">
      <label for="observacoes">💬 Observações (opcional):</label>
      <textarea id="observacoes" name="observacoes" placeholder="Deixe seus comentários aqui..."></textarea>
    </div>

    <!-- Botão Enviar -->
    <button type="submit">✅ Enviar Resultado</button>

    <div class="success-message" id="successMessage">
      ✅ Quiz enviado com sucesso! Verifique seu email.
    </div>

    <div class="error-message" id="errorMessage">
      ❌ Erro ao enviar. Tente novamente.
    </div>
  </form>

</div>

<script>
document.getElementById('quizForm').addEventListener('submit', function(e) {
  // Deixa o Formspree processar o envio
  // Após o envio, mostra mensagem de sucesso
  setTimeout(function() {
    document.getElementById('successMessage').style.display = 'block';
  }, 500);
});
</script>

</body>
</html>
